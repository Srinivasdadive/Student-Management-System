<!DOCTYPE html>

<html lang="en"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management\</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        min-height: 100vh;
        background: #eef2f7;
        padding: 35px;
    }

    /* Heading */
    h1 {
        text-align: center;
        color: #172554;
        font-size: 36px;
        margin-bottom: 30px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    /* Add Student Button */
    .add-btn {
        display: block;
        width: fit-content;
        margin: 0 auto 40px;
        text-decoration: none;
        background: #0f766e;
        color: white;
        padding: 13px 28px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(15,118,110,0.2);
    }

    .add-btn:hover {
        background: #115e59;
        transform: translateY(-3px);
    }

    /* Container */
    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 28px;
        max-width: 1400px;
        margin: auto;
    }

    /* Student Card */
    .card {
        width: 260px;
        min-height: 390px;
        padding: 22px;
        background: #ffffff;
        border-radius: 14px;
        text-align: center;
        border: 1px solid #e2e8f0;
        box-shadow: 0 5px 18px rgba(15,23,42,0.06);
        transition: 0.3s ease;
    }

    .card:hover {
        transform: translateY(-7px);
        box-shadow: 0 12px 28px rgba(15,23,42,0.12);
    }

    /* Student Image */
    .card img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #ccfbf1;
        margin-bottom: 18px;
    }

    /* Student Details */
    .card p {
        text-align: left;
        background: #f8fafc;
        padding: 10px;
        margin: 9px 0;
        border-radius: 7px;
        color: #334155;
        font-size: 14px;
        border: 1px solid #edf1f5;
    }

    /* View Button - Full Width */
    .view-btn {
        display: block;
        width: 100%;
        text-decoration: none;
        background: #1d4ed8;
        color: white;
        padding: 10px;
        border-radius: 7px;
        margin-top: 15px;
        font-weight: 600;
        font-size: 14px;
        transition: 0.3s;
    }

    .view-btn:hover {
        background: #1e40af;
    }

    /* Update and Delete Button Row */
    .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    /* Update Button */
    .update-btn {
        flex: 1;
        display: inline-block;
        text-decoration: none;
        background: #d97706;
        color: white;
        padding: 10px 5px;
        border-radius: 7px;
        font-weight: 600;
        font-size: 13px;
        transition: 0.3s;
    }

    .update-btn:hover {
        background: #b45309;
    }

    /* Delete Button */
    .delete-btn {
        flex: 1;
        background: #dc2626;
        color: white;
        border: none;
        padding: 10px 5px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .delete-btn:hover {
        background: #991b1b;
    }

    .action-buttons form {
        flex: 1;
        display: flex;
    }

    /* Responsive */
    @media (max-width: 600px) {
        body {
            padding: 18px;
        }

        h1 {
            font-size: 27px;
        }

        .card {
            width: 100%;
            max-width: 340px;
        }
    }

</style>


</head>

<body>


<h1>🎓 Student Management</h1>

<a href="/students/add" class="add-btn">+ Add Student</a>

<div class="container">

    {% for std in stds %}

    <div class="card">

        <img src="{{std[6]}}" alt="Student Image">

        <p><b>Name:</b> {{std[1]}}</p>
        <p><b>Age:</b> {{std[2]}}</p>
        <p><b>Gender:</b> {{std[3]}}</p>
        <p><b>Marks:</b> {{std[4]}}</p>
        <p><b>Course:</b> {{std[5]}}</p>

        <!-- View Button -->
        <a href="/student/{{std[0]}}" class="view-btn">View Details</a>

        <!-- Update and Delete Buttons -->
        <div class="action-buttons">

            <a href="/student/edit/{{std[0]}}" class="update-btn">Update</a>

            <form action="/std/delete/{{std[0]}}" method="post"
                  onsubmit="return confirm('Are you sure you want to delete this student?');">

                <button type="submit" class="delete-btn">Delete</button>

            </form>

        </div>

    </div>

    {% endfor %}

</div>


</body> \</html>
